[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-marketplace-taf"
version = "0.1.0"
description = "E-commerce test automation framework (Python, Pytest, Playwright)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
    "playwright>=1.49",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "allure-pytest>=2.13",
    "faker>=30.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "api: REST API tests",
    "ui: browser UI tests",
    "e2e: end-to-end business flows",
    "smoke: critical path / sanity",
    "negative: negative and boundary cases",
    "integration: API + UI cross-layer checks",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
