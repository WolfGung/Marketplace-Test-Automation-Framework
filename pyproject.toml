[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-marketplace-taf"
version = "0.1.0"
description = "Marketplace Test Automation Framework (Python, Pytest, Playwright)"
authors = [{ name = "Pavel Zhukov Atum" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
    "playwright>=1.49",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "allure-pytest>=2.13",
    "faker>=30.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]
# The stand: the small shop in `stand/` the suite runs against by default,
# plus what its own contract tests need to parse HTML without a browser.
stand = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "selectolax>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` for the framework; `.` so `stand.app` (the shop in this repository)
# imports the same way in the stand fixture and in `tests/stand`.
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "api: REST API tests",
    "ui: browser UI tests",
    "e2e: end-to-end business flows",
    "smoke: critical path / sanity",
    "negative: negative and boundary cases",
    "integration: API + UI cross-layer checks",
    "destructive: creates or changes accounts, or places an order — never run against the public site",
    "stand: the contract of the shop in stand/, checked without a browser",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# `showcase` and `scripts` are this repository's own code, not dependencies:
# without this they land in the third-party block and every module that
# imports both pytest and showcase is reported as un-sorted.
known-first-party = ["ecom_taf", "showcase", "stand"]
