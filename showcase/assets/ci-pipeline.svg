<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 740" width="860" height="740"
     role="img" aria-labelledby="ci-title ci-desc"
     font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="ci-title">What CI does with every change</title>
  <desc id="ci-desc">One workflow with four triggers: a push to main, a pull request, a nightly run at 06:00 UTC and a manual dispatch. All four take the same path. A probe asks the storefront for a status code with a thirty-second timeout. The API suite, fourteen cases, runs whatever the probe answered. The browser suite, ten cases selected by the ui or e2e markers, runs only when the probe answered HTTP 200; otherwise it is skipped rather than failed and the run posts a notice saying what the site answered. Both suites leave allure-results behind, and the browser run also leaves the video of the order when recording is switched on. On main those same artefacts go on to restore the Allure history from the gh-pages branch, generate the report, build this page from the run's own results and publish to gh-pages, which GitHub Pages serves. The nightly trigger is a watch on a site this project does not control.</desc>

  <!-- The figure is referenced through <img>, so it cannot inherit a colour
       from the host page: it carries its own light plate and dark ink, and
       reads the same in a light and a dark theme. -->
  <style>
    .plate { fill: #ffffff; }
    .zone  { fill: #f3f2ef; }
    .box   { fill: #ffffff; stroke: #222a32; stroke-width: 1.6; }
    .gate  { fill: #ffffff; stroke: #222a32; stroke-width: 1.6; }
    .lab   { fill: #47525d; font-size: 12px; font-weight: 600; letter-spacing: .09em;
             paint-order: stroke; stroke: #f3f2ef; stroke-width: 5px; stroke-linejoin: round; }
    .h     { fill: #12161b; font-size: 17px; font-weight: 650; }
    .sub   { fill: #47525d; font-size: 12.5px; }
    .t2    { fill: #12161b; font-size: 13.5px; font-weight: 650; }
    .b     { fill: #12161b; font-size: 13px; }
    .m     { fill: #47525d; font-size: 12.5px; }
    .on-line { fill: #47525d; font-size: 12.5px;
               paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
    .arrow { stroke: #222a32; stroke-width: 1.8; fill: none; marker-end: url(#head); }
    .link  { stroke: #47525d; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L9,5 L0,9.5 z" fill="#222a32"/>
    </marker>
  </defs>

  <rect class="plate" x="0" y="0" width="860" height="740"/>

  <text class="h"   x="24" y="32">What CI does with every change</text>
  <text class="sub" x="24" y="54">One workflow, four triggers. The API suite runs whatever the site answers; the browser suite runs only if it answered.</text>

  <!-- ================= lane 1: every run ================= -->
  <rect class="zone" x="24" y="78" width="812" height="338" rx="10"/>

  <rect class="box" x="40" y="112" width="156" height="76" rx="8"/>
  <text class="t2" x="118" y="142" text-anchor="middle">push to main</text>
  <text class="m"  x="118" y="166" text-anchor="middle">or a pull request</text>

  <rect class="box" x="40" y="204" width="156" height="100" rx="8"/>
  <text class="t2" x="118" y="232" text-anchor="middle">nightly 06:00 UTC</text>
  <text class="m"  x="118" y="254" text-anchor="middle">cron 0 6 * * *</text>
  <text class="m"  x="118" y="276" text-anchor="middle">a watch on a site</text>
  <text class="m"  x="118" y="294" text-anchor="middle">we do not control</text>

  <rect class="box" x="40" y="320" width="156" height="76" rx="8"/>
  <text class="t2" x="118" y="350" text-anchor="middle">manual run</text>
  <text class="m"  x="118" y="374" text-anchor="middle">workflow_dispatch</text>

  <path class="link" d="M196,150 L208,150"/>
  <path class="link" d="M196,254 L208,254"/>
  <path class="link" d="M196,358 L208,358"/>
  <path class="link" d="M208,150 L208,358"/>

  <rect class="box" x="232" y="152" width="180" height="88" rx="8"/>
  <text class="t2" x="322" y="180" text-anchor="middle">probe the storefront</text>
  <text class="m"  x="322" y="202" text-anchor="middle">curl, 30 s timeout</text>
  <text class="m"  x="322" y="220" text-anchor="middle">automationexercise.com</text>

  <path class="gate" d="M492,152 L556,196 L492,240 L428,196 z"/>
  <text class="b" x="492" y="201" text-anchor="middle">HTTP 200?</text>

  <rect class="box" x="612" y="152" width="200" height="88" rx="8"/>
  <text class="t2" x="712" y="180" text-anchor="middle">skipped, not failed</text>
  <text class="m"  x="712" y="202" text-anchor="middle">the run posts a ::notice</text>
  <text class="m"  x="712" y="220" text-anchor="middle">saying what answered</text>

  <rect class="box" x="232" y="276" width="180" height="106" rx="8"/>
  <text class="t2" x="322" y="304" text-anchor="middle">API suite</text>
  <text class="m"  x="322" y="326" text-anchor="middle">pytest -m api</text>
  <text class="b"  x="322" y="348" text-anchor="middle">14 cases</text>
  <text class="m"  x="322" y="370" text-anchor="middle">no gate: runs either way</text>

  <rect class="box" x="612" y="276" width="200" height="106" rx="8"/>
  <text class="t2" x="712" y="304" text-anchor="middle">browser suite</text>
  <text class="m"  x="712" y="326" text-anchor="middle">pytest -m "ui or e2e"</text>
  <text class="b"  x="712" y="348" text-anchor="middle">10 cases</text>
  <text class="m"  x="712" y="370" text-anchor="middle">installs chromium first</text>

  <path class="arrow" d="M208,196 L228,196"/>
  <path class="arrow" d="M208,320 L228,320"/>

  <path class="arrow" d="M412,196 L424,196"/>
  <path class="arrow" d="M556,196 L608,196"/>
  <text class="m" x="582" y="188" text-anchor="middle">not 200</text>

  <path class="arrow" d="M492,240 L492,320 L608,320"/>
  <text class="m" x="500" y="268">200</text>

  <!-- ================= the bridge: what the run leaves behind ================= -->
  <rect class="box" x="300" y="452" width="340" height="76" rx="8"/>
  <text class="t2" x="470" y="478" text-anchor="middle">what the run leaves behind</text>
  <text class="m"  x="470" y="500" text-anchor="middle">allure-results-api · allure-results-ui</text>
  <text class="m"  x="470" y="518" text-anchor="middle">and the video of the order when recording is on</text>

  <path class="arrow" d="M322,384 L322,448"/>
  <path class="arrow" d="M712,384 L712,430 L600,430 L600,448"/>

  <!-- ================= lane 2: the same run publishes itself ================= -->
  <rect class="zone" x="24" y="556" width="812" height="160" rx="10"/>

  <rect class="box" x="40" y="592" width="180" height="106" rx="8"/>
  <text class="t2" x="130" y="620" text-anchor="middle">restore the history</text>
  <text class="m"  x="130" y="642" text-anchor="middle">from the gh-pages</text>
  <text class="m"  x="130" y="660" text-anchor="middle">branch, so the trend</text>
  <text class="m"  x="130" y="678" text-anchor="middle">survives the run</text>

  <rect class="box" x="240" y="592" width="180" height="106" rx="8"/>
  <text class="t2" x="330" y="620" text-anchor="middle">generate the report</text>
  <text class="m"  x="330" y="642" text-anchor="middle">Allure, over this run</text>
  <text class="m"  x="330" y="660" text-anchor="middle">and the ones before</text>

  <rect class="box" x="440" y="592" width="180" height="106" rx="8"/>
  <text class="t2" x="530" y="620" text-anchor="middle">build this page</text>
  <text class="m"  x="530" y="642" text-anchor="middle">showcase/build.py, from</text>
  <text class="m"  x="530" y="660" text-anchor="middle">the run's own results</text>

  <rect class="box" x="640" y="592" width="180" height="106" rx="8"/>
  <text class="t2" x="730" y="620" text-anchor="middle">publish to gh-pages</text>
  <text class="m"  x="730" y="642" text-anchor="middle">GitHub Pages serves</text>
  <text class="m"  x="730" y="660" text-anchor="middle">the page and the report</text>

  <path class="arrow" d="M220,645 L238,645"/>
  <path class="arrow" d="M420,645 L438,645"/>
  <path class="arrow" d="M620,645 L638,645"/>

  <path class="arrow" d="M470,530 L470,546 L130,546 L130,588"/>
  <text class="m" x="486" y="550">on main, the same run's artefacts</text>
  <!-- Painted last, over a knockout of the lane's own fill: a connector that
       crosses a word passes behind it rather than through it. -->
  <text class="lab" x="40" y="100">EVERY RUN — GITHUB ACTIONS, .github/workflows/ci.yml</text>
  <text class="lab" x="40" y="578">ON main ONLY — THE SAME RUN PUBLISHES THIS PAGE</text>
</svg>
