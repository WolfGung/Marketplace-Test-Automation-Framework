<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 780" width="860" height="780"
     role="img" aria-labelledby="arch-title arch-desc"
     font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="arch-title">How the marketplace suite is put together</title>
  <desc id="arch-desc">Three bands and a shared column. Top: the markers smoke, negative and integration, which select across the layers rather than being layers, and under them the test modules — tests/api with 14 cases, tests/e2e with 2 and tests/ui with 8. The end-to-end module sits in the middle and a heavy path runs from it down the centre of the figure, forking into both the API client and the page objects and continuing into both doors of the application: it is the one route that crosses both. Middle band: the reusable layer — src/ecom_taf/api with HttpClient, ApiResult, ProductsApi and AccountApi, and src/ecom_taf/ui/pages with the eight page objects, reached through Playwright driving Chromium. Bottom band, drawn with a dashed edge because it is somebody else's system: the REST API at /api and the public storefront www.automationexercise.com, a live site with no local stand and no database under our control. The column on the right holds what every layer shares — tests/conftest.py, which registers a throwaway account through the API and deletes it afterwards and which writes the run's evidence, src/ecom_taf/data/user_factory.py, src/ecom_taf/models and src/ecom_taf/config/settings.py.</desc>

  <!-- The figure is referenced through <img>, so it cannot inherit a colour
       from the host page: it carries its own light plate and dark ink, and
       reads the same in a light and a dark theme. -->
  <style>
    .plate { fill: #ffffff; }
    .zone  { fill: #f3f2ef; }
    .foreign { fill: #f3f2ef; stroke: #6b7885; stroke-width: 1.6; stroke-dasharray: 8 5; }
    .box   { fill: #ffffff; stroke: #222a32; stroke-width: 1.6; }
    .chip  { stroke: #6b7885; stroke-width: 1.4; }
    .emph  { fill: #e9eef4; stroke: #12161b; stroke-width: 2.8; }
    .lab   { fill: #47525d; font-size: 12px; font-weight: 600; letter-spacing: .09em;
             paint-order: stroke; stroke: #f3f2ef; stroke-width: 5px; stroke-linejoin: round; }
    .spinelab { fill: #12161b; font-size: 13px; font-weight: 700; letter-spacing: .08em;
                paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .h     { fill: #12161b; font-size: 17px; font-weight: 650; }
    .sub   { fill: #47525d; font-size: 12.5px; }
    .t     { fill: #12161b; font-size: 15px; font-weight: 650; }
    .tbig  { fill: #12161b; font-size: 16px; font-weight: 700; }
    .t2    { fill: #12161b; font-size: 13.5px; font-weight: 650; }
    .b     { fill: #12161b; font-size: 13px; }
    .m     { fill: #47525d; font-size: 12.5px; }
    .arrow { stroke: #222a32; stroke-width: 1.8; fill: none; marker-end: url(#head); }
    .trunk { stroke: #12161b; stroke-width: 3.4; fill: none; }
    .trunk-end { stroke: #12161b; stroke-width: 3.4; fill: none; marker-end: url(#head-big); }
    .link  { stroke: #47525d; stroke-width: 1.6; fill: none; }
    .dash  { stroke: #47525d; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#head-m); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L9,5 L0,9.5 z" fill="#222a32"/>
    </marker>
    <marker id="head-big" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
      <path d="M0,0.5 L9,5 L0,9.5 z" fill="#12161b"/>
    </marker>
    <marker id="head-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L9,5 L0,9.5 z" fill="#47525d"/>
    </marker>
  </defs>

  <rect class="plate" x="0" y="0" width="860" height="780"/>

  <text class="h"   x="24" y="32">The suite, layer by layer</text>
  <text class="sub" x="24" y="54">Who asserts, what they reuse, and which door each one knocks on. The end-to-end path is the route that crosses both.</text>

  <!-- ================= band 1: markers, then the tests ================= -->
  <rect class="zone" x="24" y="78" width="612" height="218" rx="10"/>


  <rect class="box chip" x="40"  y="110" width="176" height="42" rx="8"/>
  <text class="t2" x="128" y="130" text-anchor="middle">smoke</text>
  <text class="b"  x="128" y="146" text-anchor="middle">5 cases</text>

  <rect class="box chip" x="240" y="110" width="176" height="42" rx="8"/>
  <text class="t2" x="328" y="130" text-anchor="middle">negative</text>
  <text class="b"  x="328" y="146" text-anchor="middle">7 cases</text>

  <rect class="box chip" x="440" y="110" width="176" height="42" rx="8"/>
  <text class="t2" x="528" y="130" text-anchor="middle">integration</text>
  <text class="b"  x="528" y="146" text-anchor="middle">1 case</text>


  <rect class="box" x="40" y="186" width="176" height="84" rx="8"/>
  <text class="t" x="128" y="214" text-anchor="middle">tests/api</text>
  <text class="b" x="128" y="236" text-anchor="middle">14 cases</text>
  <text class="m" x="128" y="256" text-anchor="middle">no browser needed</text>

  <rect class="box emph" x="240" y="178" width="176" height="100" rx="8"/>
  <text class="tbig" x="328" y="206" text-anchor="middle">tests/e2e</text>
  <text class="b"    x="328" y="228" text-anchor="middle">2 cases</text>
  <text class="m"    x="328" y="248" text-anchor="middle">the order, front to back</text>
  <text class="m"    x="328" y="266" text-anchor="middle">both doors in one test</text>

  <rect class="box" x="440" y="186" width="176" height="84" rx="8"/>
  <text class="t" x="528" y="214" text-anchor="middle">tests/ui</text>
  <text class="b" x="528" y="236" text-anchor="middle">8 cases</text>
  <text class="m" x="528" y="256" text-anchor="middle">what a person can see</text>

  <!-- ============ the spine: the one route across both doors ============ -->

  <path class="trunk"     d="M328,280 L328,304"/>
  <path class="trunk"     d="M240,304 L416,304"/>
  <path class="trunk-end" d="M240,304 L240,374"/>
  <path class="trunk-end" d="M416,304 L416,374"/>

  <!-- ================= band 2: the reusable layer ================= -->
  <rect class="zone" x="24" y="344" width="612" height="180" rx="10"/>

  <rect class="box" x="40" y="378" width="272" height="128" rx="8"/>
  <text class="t" x="176" y="406" text-anchor="middle">src/ecom_taf/api/</text>
  <text class="b" x="176" y="430" text-anchor="middle">HttpClient · ApiResult</text>
  <text class="b" x="176" y="450" text-anchor="middle">ProductsApi · AccountApi</text>
  <text class="m" x="176" y="474" text-anchor="middle">httpx, straight to /api</text>
  <text class="m" x="176" y="492" text-anchor="middle">normalises responseCode</text>

  <rect class="box" x="344" y="378" width="272" height="128" rx="8"/>
  <text class="t" x="480" y="406" text-anchor="middle">src/ecom_taf/ui/pages/</text>
  <text class="b" x="480" y="430" text-anchor="middle">HomePage · AuthPage · SignupPage</text>
  <text class="b" x="480" y="450" text-anchor="middle">ProductsPage · ProductDetailsPage</text>
  <text class="b" x="480" y="470" text-anchor="middle">CartPage · CheckoutPage</text>
  <text class="m" x="480" y="490" text-anchor="middle">PaymentPage · BasePage</text>

  <!-- the browser, named on the path it sits on -->
  <rect class="box pill" x="360" y="532" width="240" height="34" rx="17"/>
  <text class="b" x="480" y="554" text-anchor="middle">Playwright → Chromium</text>

  <!-- ================= band 3: the application under test ================= -->
  <rect class="foreign" x="24" y="584" width="612" height="172" rx="10"/>

  <rect class="box" x="40" y="618" width="272" height="104" rx="8"/>
  <text class="t" x="176" y="646" text-anchor="middle">REST API</text>
  <text class="b" x="176" y="668" text-anchor="middle">/api</text>
  <text class="m" x="176" y="690" text-anchor="middle">products · brands · search</text>
  <text class="m" x="176" y="708" text-anchor="middle">create and delete accounts</text>

  <rect class="box" x="344" y="618" width="272" height="104" rx="8"/>
  <text class="t" x="480" y="646" text-anchor="middle">the storefront</text>
  <text class="b" x="480" y="668" text-anchor="middle">www.automationexercise.com</text>
  <text class="m" x="480" y="690" text-anchor="middle">catalogue · search · cart</text>
  <text class="m" x="480" y="708" text-anchor="middle">sign-in · checkout · payment</text>

  <text class="m" x="616" y="744" text-anchor="end">a live public site: no local stand, no database of ours, no seeding — ads and rate limits included</text>

  <!-- ================= the shared column ================= -->
  <rect class="zone" x="652" y="78" width="184" height="678" rx="10"/>

  <rect class="box" x="664" y="114" width="160" height="158" rx="8"/>
  <text class="t2" x="744" y="140" text-anchor="middle">tests/conftest.py</text>
  <text class="m"  x="744" y="164" text-anchor="middle">the fixtures live here</text>
  <text class="m"  x="744" y="188" text-anchor="middle">registers a throwaway</text>
  <text class="m"  x="744" y="206" text-anchor="middle">account through the API</text>
  <text class="m"  x="744" y="224" text-anchor="middle">and deletes it after</text>
  <text class="m"  x="744" y="250" text-anchor="middle">failure shot · video</text>

  <rect class="box" x="664" y="296" width="160" height="100" rx="8"/>
  <text class="t2" x="744" y="322" text-anchor="middle">allure-results</text>
  <text class="t2" x="744" y="340" text-anchor="middle">+ the video</text>
  <text class="m"  x="744" y="364" text-anchor="middle">what the run leaves</text>
  <text class="m"  x="744" y="382" text-anchor="middle">behind, for the report</text>

  <rect class="box" x="664" y="420" width="160" height="98" rx="8"/>
  <text class="t2" x="744" y="446" text-anchor="middle">src/ecom_taf/data/</text>
  <text class="t2" x="744" y="464" text-anchor="middle">user_factory.py</text>
  <text class="m"  x="744" y="488" text-anchor="middle">a fresh person for</text>
  <text class="m"  x="744" y="506" text-anchor="middle">every run</text>

  <rect class="box" x="664" y="542" width="160" height="82" rx="8"/>
  <text class="t2" x="744" y="568" text-anchor="middle">src/ecom_taf/models/</text>
  <text class="m"  x="744" y="592" text-anchor="middle">typed payloads</text>
  <text class="m"  x="744" y="612" text-anchor="middle">Product · UserAccount</text>

  <rect class="box" x="664" y="648" width="160" height="82" rx="8"/>
  <text class="t2" x="744" y="674" text-anchor="middle">src/ecom_taf/config/</text>
  <text class="t2" x="744" y="692" text-anchor="middle">settings.py</text>
  <text class="m"  x="744" y="716" text-anchor="middle">environment-driven</text>

  <path class="arrow" d="M744,272 L744,292"/>
  <path class="dash"  d="M652,193 L638,193"/>
  <path class="dash"  d="M652,469 L638,469"/>
  <path class="dash"  d="M652,689 L638,689"/>

  <!-- ================= what reaches what ================= -->
  <path class="arrow" d="M128,272 L128,374"/>
  <path class="arrow" d="M528,272 L528,374"/>

  <path class="arrow" d="M128,508 L128,614"/>
  <path class="arrow" d="M544,508 L544,528"/>
  <path class="arrow" d="M544,568 L544,614"/>

  <path class="trunk-end" d="M240,508 L240,614"/>
  <path class="trunk-end" d="M416,508 L416,528"/>
  <path class="trunk-end" d="M416,568 L416,614"/>

  <path class="dash" d="M342,670 L316,670"/>
  <text class="spinelab" x="40" y="330">THE END-TO-END PATH</text>
  <!-- Painted last, over a knockout of the band's own fill: a connector that
       crosses a word passes behind it rather than through it. -->
  <text class="lab" x="40" y="100">MARKERS — THEY SELECT ACROSS THE LAYERS; THEY ARE NOT LAYERS</text>
  <text class="lab" x="40" y="170">TESTS — WHERE THE ASSERTIONS LIVE</text>
  <text class="lab" x="40" y="366">THE REUSABLE LAYER — A CHANGE LANDS HERE ONCE</text>
  <text class="lab" x="40" y="606">THE APPLICATION UNDER TEST — NOT OUR SYSTEM</text>
  <text class="lab" x="664" y="100">SHARED ACROSS LAYERS</text>
</svg>
