name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  reachable:
    name: Storefront reachable from this runner
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.probe.outputs.status }}
    steps:
      - id: probe
        name: Probe the storefront
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://www.automationexercise.com/)
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "The storefront answered HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::notice title=Browser tests skipped::The storefront answered HTTP $code from this runner. The application under test is a third-party site this project does not control, so the browser suite is skipped rather than reported as failing. The API suite still ran."
          fi

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install .
      - name: Run API tests
        run: pytest -m api --alluredir=allure-results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results

  framework:
    # The suite's checks of itself, including the pins that hold every number
    # on the published page, on the profile cover and in the README to what
    # pytest actually collects. Nothing here touches the marketplace, so it is
    # not gated on the probe and runs on every push and pull request exactly as
    # the API job does; `showcase` needs it, so a stale number cannot publish.
    #
    # It writes no allure-results and uploads no artifact on purpose. The
    # published page is about the marketplace -- it states the 24 checks of the
    # application and counts nothing else -- and results from this job would put
    # the framework's own cases into the figures it is meant to be guarding.
    name: Framework checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install .
      - name: Run the framework's own checks
        run: pytest tests/unit

  ui:
    name: UI and E2E tests
    runs-on: ubuntu-latest
    needs: reachable
    if: needs.reachable.outputs.status == '200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install .
      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      - name: Run UI and E2E tests
        run: pytest -m "ui or e2e" --alluredir=allure-results
        env:
          RECORD_VIDEO: "true"
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: videos
          if-no-files-found: ignore

  showcase:
    name: Publish showcase
    runs-on: ubuntu-latest
    needs: [api, ui, framework]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    concurrency:
      group: showcase-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - uses: actions/download-artifact@v4
        with:
          name: allure-results-api
          path: allure-results-api
      - uses: actions/download-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results-ui
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: videos
          path: videos
      - name: Assemble and publish
        run: bash scripts/publish-showcase.sh allure-results-api allure-results-ui videos
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
