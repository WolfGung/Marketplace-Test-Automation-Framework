name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      cross_browser:
        # Off by default, and checked by the `browsers` job below. Pressing
        # "Run workflow" is how anyone re-runs this pipeline by hand -- to
        # force a re-publication, to retry a leg the third-party site failed --
        # and none of those reasons is a reason to drive the suite at that site
        # three more times. The traffic should happen when somebody asks for
        # cross-browser, not when somebody asks for something else and gets it.
        description: "Also run the browser suite on Firefox and WebKit"
        type: boolean
        default: false
        required: false

jobs:
  reachable:
    name: Storefront reachable from this runner
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.probe.outputs.status }}
    steps:
      - id: probe
        name: Probe the storefront
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://www.automationexercise.com/)
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "The storefront answered HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::notice title=Browser tests skipped::The storefront answered HTTP $code from this runner. The application under test is a third-party site this project does not control, so the browser suite is skipped rather than reported as failing. The API suite still ran."
          fi

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install .
      - name: Run API tests
        run: pytest -m api --alluredir=allure-results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results

  framework:
    # The suite's checks of itself, including the pins that hold every number
    # on the published page, on the profile cover and in the README to what
    # pytest actually collects. Nothing here touches the marketplace, so it is
    # not gated on the probe and runs on every push and pull request exactly as
    # the API job does; `showcase` needs it, so a stale number cannot publish.
    #
    # It writes no allure-results and uploads no artifact on purpose. The
    # published page is about the marketplace -- it states the 24 checks of the
    # application and counts nothing else -- and results from this job would put
    # the framework's own cases into the figures it is meant to be guarding.
    name: Framework checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install .
      - name: Run the framework's own checks
        run: pytest tests/unit

  ui:
    name: UI and E2E tests
    runs-on: ubuntu-latest
    needs: reachable
    if: needs.reachable.outputs.status == '200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install .
      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      - name: Run UI and E2E tests
        run: pytest -m "ui or e2e" --alluredir=allure-results
        env:
          RECORD_VIDEO: "true"
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: videos
          if-no-files-found: ignore
      # The Playwright trace of the end-to-end run: the report says what
      # happened, the trace lets anyone step through it action by action with
      # the DOM at each step. Uploaded even when the run failed -- that is when
      # it is worth the most.
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces
          path: traces
          if-no-files-found: ignore

  browsers:
    # The same browser suite on all three engines, and only when somebody asks
    # for it. Two conditions, not one: `workflow_dispatch` is the only trigger
    # that can reach this job, so a push, a pull request and the nightly
    # schedule never start it -- and within a manual run it still waits for the
    # `cross_browser` input, because the button is also how this pipeline gets
    # re-run for reasons that have nothing to do with engines. A re-publication
    # or a retry of a leg the site failed would otherwise fire three more
    # suites at somebody else's application, which is the exact cost this job
    # is arranged to avoid.
    #
    # Not a matter of runner minutes. The application under test is a public
    # demo site belonging to somebody else, the suite already creates and
    # deletes real accounts on it, and running every push three times over
    # would triple that traffic to learn nothing: no assertion in this suite is
    # about how a page renders in one engine versus another, so the second and
    # third leg answer the same question the first already answered. The engine
    # is a setting (`Settings.browser`, read from `BROWSER`), and the question
    # "does the suite still run on Firefox and WebKit" is worth asking
    # deliberately -- after a Playwright upgrade, when a locator changes,
    # before showing the project to somebody -- which is exactly when a person
    # presses the button.
    #
    # `fail-fast: false` because the point is which engines pass. Cancelling
    # WebKit because Firefox failed would throw away the half of the answer
    # that is not yet known.
    name: Browser suite on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: reachable
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.cross_browser
      && needs.reachable.outputs.status == '200'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install .
      - name: Install Playwright browser
        run: playwright install --with-deps ${{ matrix.browser }}
      - name: Run UI and E2E tests on ${{ matrix.browser }}
        # The engine is chosen by configuration, not by a pytest flag: the
        # `browser` fixture asks `Settings.browser` for it, and that setting
        # reads `BROWSER` like every other setting in this project.
        run: pytest -m "ui or e2e" --alluredir=allure-results
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results

  showcase:
    name: Publish showcase
    runs-on: ubuntu-latest
    needs: [api, ui, framework]
    # Two gates, and no third one. The branch is gated here; the run being
    # green is gated by `needs`, which holds this job back until the API suite,
    # the browser suite and the framework's own checks have all passed — so a
    # red run cannot replace the published page with itself.
    #
    # Which runs reach this job, then: a push to main; a nightly that came back
    # green, which is the point of having one (a page still dated last week
    # says nothing about a site that answered fine this morning), and a red
    # nightly still publishes nothing because `needs` is unchanged; and a
    # manual dispatch from main, which is how anyone re-publishes by hand. A
    # pull request never does — its `github.ref` is `refs/pull/<n>/merge`, not
    # this branch.
    #
    # There used to be a third gate here, `github.event_name == 'push'`, and it
    # quietly made the "Run workflow" button do nothing for the one reason
    # people press it. The last re-publication had to be faked with an empty
    # commit; that is the shape of the bug it caused.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: showcase-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - uses: actions/download-artifact@v4
        with:
          name: allure-results-api
          path: allure-results-api
      - uses: actions/download-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results-ui
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: videos
          path: videos
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: traces
          path: traces
      - name: Assemble and publish
        run: bash scripts/publish-showcase.sh allure-results-api allure-results-ui videos traces
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
